[artifacts]
output_dir = "build/scripts"
include_manifest = true
# none = leave the generated artifact as a directory
# zip = also write an archive of the complete generated artifact
archive_format = "none"

[package]
# tree = copy .py package directories into lib/ (best for inspection)
# executable = build one PyInstaller runtime in lib/ and point scripts at it
lib_layout = "tree"
# CLI entrypoints built by make package.
tools = ["stick", "vault", "wipe", "forge"]


[sticks.green]
device_path = "/dev/disk/by-id/<DEVICE_ID>"
purpose = "working stick"

[sticks.green.vaults.personal]
size = "256M"
purpose = "personal data"

[sticks.green.vaults.work]
size = "256M"
purpose = "work data"

[forge.scripts.green-stick-wipe-fast]
type = "atomic"
disabled = false
tool = "wipe"
command = "stick"
help = "Fast wipe the configured green stick for reuse."
stick_id = "green"
fixed_args = ["--fast"]

[forge.scripts.green-stick-wipe-full]
type = "atomic"
disabled = false
tool = "wipe"
command = "stick"
help = "Fully overwrite the configured green stick."
stick_id = "green"
fixed_args = ["--full"]

[forge.scripts.green-stick-create]
type = "atomic"
disabled = false
tool = "stick"
command = "create"
help = "Create the configured green stick."
stick_id = "green"

[forge.scripts.green-stick-create-check]
type = "atomic"
disabled = false
tool = "stick"
command = "create"
help = "Check whether the configured green stick is ready for provisioning."
stick_id = "green"
fixed_args = ["--status"]

[forge.scripts.green-stick-mount]
