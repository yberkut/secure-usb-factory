disabled = false
tool = "stick"
command = "mount"
help = "Show current runtime state for the configured green stick."
stick_id = "green"
fixed_args = ["--status"]

[forge.scripts.green-stick-unmount]
type = "atomic"
disabled = false
tool = "stick"
command = "unmount"
help = "Unmount the configured green stick."
stick_id = "green"

